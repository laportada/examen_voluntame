<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Misión</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page">
    <header class="topbar">
        <h1>Editar misión</h1>
        <div>
            <a href="/dashboard" class="btn">Inicio</a>
            <a href="/logout" class="btn btn-secondary">Cerrar Sesión</a>
        </div>
    </header>

    <main class="main">
        {% with mensajes = get_flashed_messages(category_filter=['mision']) %}
        {% if mensajes %}
            <ul class="errores">
            {% for msg in mensajes %}
                <li>{{ msg }}</li>
            {% endfor %}
            </ul>
        {% endif %}
        {% endwith %}

        <form action="/misiones/actualizar/{{ mision.id }}" method="post" class="form card">
            <label>Nombre:</label>
            <input type="text" name="nombre" value="{{ mision.nombre }}">

            <label>Fecha:</label>
            <input type="date" name="fecha" value="{{ mision.fecha }}">

            <label>Voluntarios necesarios (2 a 20):</label>
            <input type="number" name="voluntarios_necesarios" value="{{ mision.voluntarios_necesarios }}">

            <label>Descripción:</label>
            <textarea name="descripcion" rows="4">{{ mision.descripcion }}</textarea>

            <button type="submit">Actualizar</button>
        </form>
    </main>
</body>
</html>
